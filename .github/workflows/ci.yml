name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Run the full test suite, demo byte-diff, README check, proof tamper
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Run flake checks
        run: nix flake check
        env:
          # GitHub Actions runners have user namespaces enabled
          # and a proper /nix/store, so sandboxed builds work
          NIX_STORE_DIR: ""

  # Build packages to verify they compile
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Build sumo-cli
        run: nix build .#sumo-cli

      - name: Build sumo-tui
        run: nix build .#sumo-tui

      - name: Build sumo-facts
        run: nix build .#sumo-facts

  # Verify nix run works (the installable entrypoint)
  run-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Smoke test nix run
        run: |
          nix run .# -- version
          nix run .# -- status --json | jq -e '.services >= 0'

  # Verify dev shell works
  dev-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Test dev shell
        run: |
          nix develop -c "echo 'Dev shell works' && sumo version"
  # D1 — the live metavisor tour: config gate -> proven drift -> verified
  # repair, on a real NixOS systemd container. The transcript is normalized
  # (timestamps, snapshot ids, hashes) and byte-compared, so the run is also
  # the end-to-end regression test.
  metavisor-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman fuse-overlayfs

      - name: Build the NixOS container image
        run: ./container/run.sh build

      - name: Run the metavisor tour (byte-stable transcript)
        run: ./tools/metavisor-tour.sh --check
